name = "veesibi"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Environment variables (set via Cloudflare Dashboard or: wrangler secret put VARIABLE_NAME)
# [vars]
# NEXT_PUBLIC_SITE_URL = "https://veesibi.com"

# Secrets (set via: wrangler secret put SECRET_NAME)
# Required secrets:
#   NEXT_PUBLIC_SUPABASE_URL - Supabase project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY - Supabase anonymous key
#   SUPABASE_SERVICE_ROLE_KEY - Supabase service role key
#   OPENROUTER_API_KEY - OpenRouter API key for AI citation queries
#   PAYPAL_CLIENT_ID - PayPal client ID
#   PAYPAL_CLIENT_SECRET - PayPal client secret
#   PAYPAL_WEBHOOK_ID - PayPal webhook ID
#   UPSTASH_REDIS_REST_URL - Upstash Redis REST URL (for rate limiting)
#   UPSTASH_REDIS_REST_TOKEN - Upstash Redis REST token
#   RESEND_API_KEY - Resend email API key
#   CRON_SECRET - Cron job authentication secret
